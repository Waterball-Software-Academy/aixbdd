openapi: 3.0.3
info:
  title: {{API_TITLE}}
  version: {{API_VERSION}}
  description: {{API_DESCRIPTION}}
paths:
  {{PATH_1}}:
    {{METHOD_1}}:
      summary: {{METHOD_1_SUMMARY}}
      description: {{METHOD_1_DESCRIPTION}}
      operationId: {{METHOD_1_OPERATION_ID}}
      tags:
        - {{METHOD_1_TAG}}
      requestBody:
        required: {{METHOD_1_REQUEST_REQUIRED}}
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/{{METHOD_1_REQUEST_SCHEMA}}'
      responses:
        '{{METHOD_1_SUCCESS_STATUS}}':
          description: {{METHOD_1_SUCCESS_DESCRIPTION}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/{{METHOD_1_RESPONSE_SCHEMA}}'
        '{{METHOD_1_ERROR_STATUS}}':
          description: {{METHOD_1_ERROR_DESCRIPTION}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/{{ERROR_SCHEMA}}'
      x-realtime-note: {{METHOD_1_REALTIME_NOTE}}
components:
  schemas:
    {{METHOD_1_REQUEST_SCHEMA}}:
      type: object
      required:
        - {{REQUEST_REQUIRED_FIELD}}
      properties:
        {{REQUEST_REQUIRED_FIELD}}:
          type: {{REQUEST_REQUIRED_FIELD_TYPE}}
    {{METHOD_1_RESPONSE_SCHEMA}}:
      type: object
      properties:
        {{RESPONSE_FIELD_1}}:
          type: {{RESPONSE_FIELD_1_TYPE}}
    {{ERROR_SCHEMA}}:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

# 依實際操作數量增減 paths 與 schema 區塊。
