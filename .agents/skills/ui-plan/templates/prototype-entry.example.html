<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>電商首頁與商品入口</title>
  <style>
    :root {
      --bg: #070b17;
      --panel: rgba(10, 18, 36, 0.88);
      --primary: #6f7bff;
      --text: #f3f6ff;
      --muted: #9ea9c7;
      --danger: #ff7a9b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #152248, var(--bg));
      color: var(--text);
    }

    .shell {
      width: min(100%, 1120px);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
    }

    .hero, .panel {
      border-radius: 24px;
      padding: 32px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
    }

    .eyebrow {
      color: var(--primary);
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: 48px;
      line-height: 1.05;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 24px;
    }

    .stat {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 18px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 16px 20px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), #4856ff);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .hint, .error {
      margin-top: 12px;
      font-size: 14px;
    }

    .hint { color: var(--muted); }
    .error { color: var(--danger); min-height: 20px; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="eyebrow">online store</div>
      <h1>搜尋想買的商品，快速開始本次選購</h1>
      <p>從日常用品到居家配件，用關鍵字快速找到商品，直接進入清楚好逛的選購流程。</p>
      <div class="stats">
        <div class="stat">
          <strong>120+ Items</strong>
          <p>熱門商品持續更新</p>
        </div>
        <div class="stat">
          <strong>24h Ship</strong>
          <p>快速出貨資訊清楚</p>
        </div>
        <div class="stat">
          <strong>Easy Checkout</strong>
          <p>從加入購物車到結帳一氣呵成</p>
        </div>
      </div>
    </section>

    <section class="panel">
      <label for="primaryInput">搜尋關鍵字</label>
      <input id="primaryInput" placeholder="例如 保溫瓶、收納盒、桌燈" />
      <button id="primaryAction">開始逛商品</button>
      <div class="hint">輸入商品名稱或品類後，前往商品列表頁並查看推薦結果。</div>
      <div class="error" id="errorMessage"></div>
    </section>
  </main>

  <script>
    const button = document.getElementById("primaryAction");
    const input = document.getElementById("primaryInput");
    const errorMessage = document.getElementById("errorMessage");

    button.addEventListener("click", () => {
      const value = input.value.trim();
      if (value.length < 2) {
        errorMessage.textContent = "請至少輸入兩個字元的搜尋關鍵字";
        return;
      }
      errorMessage.textContent = "";
      window.location.href = "product-list.html";
    });
  </script>
</body>
</html>
