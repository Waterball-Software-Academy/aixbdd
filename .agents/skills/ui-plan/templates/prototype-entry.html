<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{PAGE_TITLE}}</title>
  <style>
    :root {
      --bg: {{PAGE_BACKGROUND}};
      --panel: {{PANEL_BACKGROUND}};
      --primary: {{BRAND_PRIMARY_COLOR}};
      --text: {{TEXT_COLOR}};
      --muted: {{MUTED_TEXT_COLOR}};
      --danger: {{DANGER_COLOR}};
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, {{PAGE_BACKGROUND_ACCENT}}, var(--bg));
      color: var(--text);
    }

    .shell {
      width: min(100%, 1120px);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
    }

    .hero, .panel {
      border-radius: 24px;
      padding: 32px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
    }

    .eyebrow {
      color: var(--primary);
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: 48px;
      line-height: 1.05;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 24px;
    }

    .stat {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 18px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 16px 20px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), {{BRAND_PRIMARY_COLOR_DARK}});
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .hint, .error {
      margin-top: 12px;
      font-size: 14px;
    }

    .hint { color: var(--muted); }
    .error { color: var(--danger); min-height: 20px; }

    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      h1 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="eyebrow">{{PRODUCT_EYEBROW}}</div>
      <h1>{{PRODUCT_HEADLINE}}</h1>
      <p>{{PRODUCT_SUBTITLE}}</p>
      <div class="stats">
        <div class="stat">
          <strong>{{STAT_1_VALUE}}</strong>
          <p>{{STAT_1_LABEL}}</p>
        </div>
        <div class="stat">
          <strong>{{STAT_2_VALUE}}</strong>
          <p>{{STAT_2_LABEL}}</p>
        </div>
        <div class="stat">
          <strong>{{STAT_3_VALUE}}</strong>
          <p>{{STAT_3_LABEL}}</p>
        </div>
      </div>
    </section>

    <section class="panel">
      <label for="primaryInput">{{INPUT_LABEL}}</label>
      <input id="primaryInput" placeholder="{{INPUT_PLACEHOLDER}}" />
      <button id="primaryAction">{{PRIMARY_CTA_LABEL}}</button>
      <div class="hint">{{HELPER_TEXT}}</div>
      <div class="error" id="errorMessage"></div>
    </section>
  </main>

  <script>
    const button = document.getElementById("primaryAction");
    const input = document.getElementById("primaryInput");
    const errorMessage = document.getElementById("errorMessage");

    button.addEventListener("click", () => {
      const value = input.value.trim();
      if (!/{{INPUT_VALIDATION_REGEX}}/.test(value)) {
        errorMessage.textContent = "{{INPUT_ERROR_MESSAGE}}";
        return;
      }
      errorMessage.textContent = "";
      window.location.href = "{{PRIMARY_CTA_TARGET}}";
    });
  </script>
</body>
</html>
