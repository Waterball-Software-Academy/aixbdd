dsl_steps:
  # done
  - name: 會籍_指定狀態方案
    format: '"{alias}" 有一筆 "{status}" 的 "{plan}" 會籍'
    isa_steps:
      - instruction: '準備一個會籍, with table:'
        table:
          '>{{alias}}會籍.id': '<id'
          status: '{{status}}'

  # red-execute 階段機械修補新增的定義：沒有 `# done`，但 isa_steps 已備妥
  - name: 凍結會籍
    format: '"{actor}" 凍結 "{owner}" 的會籍'
    isa_steps:
      - instruction: '(No Actor) 凍結會籍, call table:'
        table:
          membershipId: '${{owner}}會籍.id'

  - name: 會籍狀態變更斷言
    format: '"{alias}" 的會籍變成 "{status}"'
    isa_steps:
      - instruction: '應該存在一個會籍, with table:'
        table:
          status: '{{status}}'
