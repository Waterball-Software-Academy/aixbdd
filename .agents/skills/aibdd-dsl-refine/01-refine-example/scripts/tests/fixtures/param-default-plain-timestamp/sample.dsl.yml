dsl_steps:
  - name: 教練前置
    format: 系統中已有一位 "{coach}"
    isa_steps:
      - instruction: '準備一個教練, with table:'
        table:
          '>{{coach}}.id': '<id'
          name: '{{coach}}'

  - name: 開課
    format: '"{coach}" 開一堂 "{course}" 課程'
    params:
      開始時間: '2026-03-02 02:00:00'
    isa_steps:
      - instruction: '(No Actor) 開課, call table:'
        table:
          coachName: '{{coach}}'
          courseName: '{{course}}'
          startTime: '{{開始時間}}'

  - name: 系統回應訊息
    format: 系統回應 "{message}"
    isa_steps:
      - instruction: '開課(201)回應, with table:'
        table:
          message: '{{message}}'
