dsl_steps:
  - name: 會員_基本資料
    format: 系統中已有會員 "{alias}"，手機 "{phone}"
    isa_steps:
      - instruction: '準備一個會員, with table:'
        table:
          '>{{alias}}.id': '<id'
          name: '{{alias}}'
          phone: '{{phone}}'

  # 複合佈建句：一句同時佈會員與會籍——與上一句撞同一筆會員
  - name: 會籍_指定狀態方案
    format: '"{alias}" 有一筆 "{status}" 的 "{plan}" 會籍'
    params:
      phone: '0912345678'
    isa_steps:
      - instruction: '準備一個會員, with table:'
        table:
          '>{{alias}}.id': '<id'
          name: '{{alias}}'
          phone: '{{phone}}'
      - instruction: '準備一個會籍, with table:'
        table:
          '>{{alias}}會籍.id': '<id'
          member_id: '${{alias}}.id'
          status: '{{status}}'
          plan: '{{plan}}'

  - name: 購買會籍
    format: 系統為 "{alias}" 購買 "{plan}"
    isa_steps:
      - instruction: '(No Actor) 購買會籍, call table:'
        table:
          memberId: '${{alias}}.id'
          plan: '{{plan}}'

  - name: 會籍方案斷言
    format: '"{alias}" 的會籍方案是 "{plan}"'
    isa_steps:
      - instruction: '應該存在一個會籍, with table:'
        table:
          member_id: '${{alias}}.id'
          plan: '{{plan}}'
